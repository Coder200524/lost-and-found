<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — FinDora</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rose:#f9c8cf;--mint:#c4ead9;--sky:#c5dff8;--lemon:#fdf3c0;--lavender:#ddd6f3;--peach:#ffd9b7;
    --rose-d:#e8848f;--mint-d:#5bbf8e;--sky-d:#5b9fd4;--lav-d:#9b8bdb;
    --text:#3a3040;--text-s:#7a6e80;--white:#fffcfd;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'DM Sans',sans-serif;
    background:linear-gradient(135deg,#fef4f7 0%,#f0f8ff 50%,#f4f0ff 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .login-wrap{
    width:100%;max-width:480px;
  }
  .back-link{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--text-s);text-decoration:none;font-size:0.88rem;
    margin-bottom:28px;
  }
  .back-link:hover{color:var(--rose-d)}

  .card{
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(20px);
    border:1.5px solid rgba(255,255,255,0.9);
    border-radius:24px;
    padding:44px 40px;
    box-shadow:0 16px 64px rgba(140,100,130,0.12);
  }
  .card-logo{
    display:flex;align-items:center;gap:10px;margin-bottom:28px;
  }
  .card-logo-icon{
    width:48px;height:48px;border-radius:14px;
    background:linear-gradient(135deg,var(--rose),var(--lavender));
    display:flex;align-items:center;justify-content:center;font-size:1.4rem;
  }
  .card-logo-text{
    font-family:'Playfair Display',serif;
    font-size:1.3rem;font-weight:700;color:var(--text);
  }
  .card-logo-text span{color:var(--rose-d)}

  h2{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;margin-bottom:6px}
  .sub{font-size:0.9rem;color:var(--text-s);margin-bottom:32px}

  /* TABS */
  .tabs{display:flex;gap:0;background:rgba(0,0,0,0.05);border-radius:12px;padding:4px;margin-bottom:28px}
  .tab{
    flex:1;text-align:center;padding:10px;border-radius:9px;cursor:pointer;
    font-size:0.88rem;font-weight:500;color:var(--text-s);border:none;background:none;
    transition:all 0.2s;
  }
  .tab.active{background:white;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,0.08)}

  /* FORM */
  .field{margin-bottom:18px}
  label{display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;color:var(--text)}
  input[type=text],input[type=password],input[type=email]{
    width:100%;padding:13px 16px;
    background:rgba(0,0,0,0.04);
    border:1.5px solid rgba(0,0,0,0.08);
    border-radius:12px;font-size:0.95rem;font-family:'DM Sans',sans-serif;
    color:var(--text);transition:border-color 0.2s,box-shadow 0.2s;
    outline:none;
  }
  input:focus{border-color:var(--rose-d);box-shadow:0 0 0 3px rgba(232,132,143,0.15)}

  .otp-row{display:flex;gap:8px;margin-top:8px}
  .otp-row input{flex:1;text-align:center;font-size:1.3rem;font-weight:600;letter-spacing:0.2em;padding:12px 6px}
  
  .send-otp{
    width:100%;padding:12px;
    background:var(--lavender);border:none;border-radius:12px;
    font-size:0.88rem;font-weight:600;color:var(--lav-d);cursor:pointer;
    margin-bottom:12px;transition:all 0.2s;
  }
  .send-otp:hover{background:var(--lav-d);color:white}
  .send-otp:disabled{opacity:0.6;cursor:default}

  .btn-main{
    width:100%;padding:15px;
    background:var(--rose-d);color:white;border:none;border-radius:12px;
    font-size:1rem;font-weight:600;cursor:pointer;
    transition:all 0.2s;box-shadow:0 4px 20px rgba(232,132,143,0.35);
    margin-top:8px;
  }
  .btn-main:hover{background:#d0606c;transform:translateY(-1px);box-shadow:0 8px 28px rgba(232,132,143,0.4)}

  .divider{
    display:flex;align-items:center;gap:12px;
    color:var(--text-s);font-size:0.8rem;margin:20px 0;
  }
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(0,0,0,0.08)}

  .info-banner{
    background:var(--lemon);border:1.5px solid #f0d870;
    border-radius:12px;padding:14px 16px;
    display:flex;gap:10px;align-items:flex-start;
    font-size:0.83rem;color:#6a5a00;margin-bottom:20px;
  }

  .forgot{text-align:center;margin-top:16px;font-size:0.85rem;color:var(--text-s)}
  .forgot a{color:var(--rose-d);text-decoration:none;font-weight:500}

  /* animations */
  .panel{display:none}
  .panel.active{display:block;animation:fadeIn 0.3s}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* OTP timer */
  .timer{font-size:0.8rem;color:var(--text-s);text-align:center;margin-top:6px}
  .timer span{color:var(--rose-d);font-weight:600}

  @media(max-width:520px){.card{padding:32px 24px}}
</style>
</head>
<body>

<div class="login-wrap">
  <a href="index.html" class="back-link">← Back to Home</a>

  <div class="card">
    <div class="card-logo">
      <div class="card-logo-icon">🔍</div>
      <div class="card-logo-text">Swipe <span>&</span> Find</div>
    </div>

    <h2>Welcome back</h2>
    <p class="sub">Sign in with your SVKM SAP ID to continue</p>

    <div class="info-banner">
      <span>🔒</span>
      <span>This platform is <strong>exclusively for SVKM students</strong>. A valid SAP ID and institutional email are required.</span>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN PANEL -->
    <div class="panel active" id="panel-login">
      <div class="field">
        <label>SAP ID</label>
        <input type="text" placeholder="e.g. 60004220001" maxlength="14">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" placeholder="Enter your password">
      </div>
      <div class="field">
        <label>College Email OTP</label>
        <button class="send-otp" onclick="startOTP(this)">Send OTP to svkm.edu.in email</button>
        <div class="otp-row">
          <input type="text" maxlength="1" oninput="otpNext(this,0)">
          <input type="text" maxlength="1" oninput="otpNext(this,1)">
          <input type="text" maxlength="1" oninput="otpNext(this,2)">
          <input type="text" maxlength="1" oninput="otpNext(this,3)">
          <input type="text" maxlength="1" oninput="otpNext(this,4)">
          <input type="text" maxlength="1" oninput="otpNext(this,5)">
        </div>
        <div class="timer" id="timer" style="display:none">Resend in <span id="countdown">60</span>s</div>
      </div>
      <button class="btn-main" onclick="goToDashboard()">Login →</button>
      <p class="forgot"><a href="#">Forgot password?</a> · <a href="#">Having trouble?</a></p>
    </div>

    <!-- REGISTER PANEL -->
    <div class="panel" id="panel-register">
      <div class="field">
        <label>Full Name</label>
        <input type="text" placeholder="As per college records">
      </div>
      <div class="field">
        <label>SAP ID</label>
        <input type="text" placeholder="e.g. 60004220001" maxlength="14">
      </div>
      <div class="field">
        <label>SVKM College Email</label>
        <input type="email" placeholder="sapid@svkm.edu.in">
      </div>
      <div class="field">
        <label>Create Password</label>
        <input type="password" placeholder="Min. 8 characters">
      </div>
      <div class="field">
        <label>Verify OTP sent to college email</label>
        <button class="send-otp" onclick="startOTP(this)">Send OTP</button>
        <div class="otp-row">
          <input type="text" maxlength="1">
          <input type="text" maxlength="1">
          <input type="text" maxlength="1">
          <input type="text" maxlength="1">
          <input type="text" maxlength="1">
          <input type="text" maxlength="1">
        </div>
      </div>
      <button class="btn-main" onclick="goToDashboard()">Create Account →</button>
    </div>
  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1)));
  document.querySelectorAll('.panel').forEach((p,i) => p.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1)));
}

function otpNext(el, idx) {
  el.value = el.value.replace(/\D/g,'');
  const inputs = el.closest('.otp-row').querySelectorAll('input');
  if (el.value && idx < 5) inputs[idx+1].focus();
}

function startOTP(btn) {
  btn.disabled = true;
  btn.textContent = '✓ OTP Sent!';
  const timer = btn.parentNode.querySelector('#timer') || document.getElementById('timer');
  if(timer) timer.style.display='block';
  let secs = 60;
  const cd = document.getElementById('countdown');
  const iv = setInterval(() => {
    secs--;
    if(cd) cd.textContent = secs;
    if (secs <= 0) {
      clearInterval(iv);
      btn.disabled = false;
      btn.textContent = 'Resend OTP';
      if(timer) timer.style.display='none';
    }
  }, 1000);
}

function goToDashboard() {
  window.location.href = 'browse.html';
}
</script>
</body>
</html>
